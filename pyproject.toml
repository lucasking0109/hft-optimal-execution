[project]
name = "hft"
version = "0.1.0"
description = "B2 大單最佳執行研究 — Optimal Execution Research with Tick Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "streamlit>=1.40",
    "streamlit-aggrid>=1.0.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
